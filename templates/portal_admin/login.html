{% load static core_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Login | Gujarat UCC Editorial Portal</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    
    <style>
        body {
            background: #0F172A;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif;
            padding: 20px;
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }
        .login-card {
            background: #FFFFFF;
            border-radius: 12px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
            border: 1px solid #334155;
        }
        .login-head {
            background: #1E293B;
            padding: 32px 28px;
            text-align: center;
            color: #FFFFFF;
            border-bottom: 1px solid #334155;
        }
        .login-icon-box {
            width: 48px;
            height: 48px;
            background: rgba(180, 83, 9, 0.2);
            border: 1px solid rgba(245, 158, 11, 0.4);
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #F59E0B;
            margin-bottom: 14px;
        }
        .login-body {
            padding: 32px 28px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            font-size: 0.84rem;
            font-weight: 700;
            color: #334155;
            margin-bottom: 6px;
        }
        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #CBD5E1;
            border-radius: 6px;
            font-size: 0.92rem;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
            transition: all 0.15s ease;
        }
        .form-control:focus {
            border-color: #B45309;
            box-shadow: 0 0 0 3px rgba(180, 83, 9, 0.15);
        }
        .btn-submit {
            width: 100%;
            background: #B45309;
            color: #FFFFFF;
            border: none;
            padding: 11px 16px;
            border-radius: 6px;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-submit:hover {
            background: #92400E;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-head">
        <div class="login-icon-box">
            <svg class="icon-svg icon-lg" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
        </div>
        <h2 style="font-size: 1.2rem; font-weight: 800; margin: 0 0 4px; letter-spacing: -0.2px;">Gujarat UCC Workspace</h2>
        <p style="font-size: 0.8rem; color: #94A3B8; margin: 0;">Editorial CMS &amp; Legal Verification Desk</p>
    </div>

    <div class="login-body">
        {% if messages %}
            {% for message in messages %}
            <div style="padding: 10px 14px; border-radius: 6px; margin-bottom: 18px; font-size: 0.85rem; font-weight: 600; background: #FEE2E2; color: #991B1B; border: 1px solid #FCA5A5;">
                {{ message }}
            </div>
            {% endfor %}
        {% endif %}

        <form method="post" action="{% url 'portal_admin_login' %}">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="admin" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <div style="margin-top: 24px;">
                <button type="submit" class="btn-submit">
                    <span>Sign In to Executive Desk</span>
                    <svg class="icon-svg icon-xs" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                </button>
            </div>
        </form>

        <div style="margin-top: 24px; text-align: center; border-top: 1px solid #F1F5F9; padding-top: 18px;">
            <a href="{% url 'home' %}" style="font-size: 0.82rem; color: #64748B; text-decoration: none; font-weight: 600;">
                ← Return to Public Website
            </a>
        </div>
    </div>
</div>

</body>
</html>
